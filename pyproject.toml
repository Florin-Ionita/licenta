[project]
name = "qtls-qkd"
version = "0.1.0"
description = "Information-theoretic secure protocol (TLS 1.3-shaped) over a simulated QKD network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qkd*", "kme*", "qtls*", "app*", "viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: long-running tests (e.g. the literal 30s Phase 2 run); deselected by default",
]
addopts = "-m 'not slow'"
