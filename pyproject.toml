[project]
name = "qtls-qkd"
version = "0.1.0"
description = "Information-theoretic secure protocol (TLS 1.3-shaped) over a simulated QKD network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Quantum simulation (Phase 1).
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "numpy>=1.26",
    # KME REST surface (Phase 3) and the QTLS handshake client (Phase 5).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    # HKDF, SHA-256/384, self-signed cert generation for mTLS.
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
viz = [
    # Phase 7 live dashboard.
    "streamlit>=1.31",
    "plotly>=5.20",
    "networkx>=3.2",          # also needed by Phase 8 relay
    "streamlit-autorefresh>=1.0",
]
bench = [
    # Phase 9 evaluation harness.
    "pyperf>=2.6",
    "kaleido>=0.2,<1.0",      # Plotly's PDF/PNG export engine
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qkd*", "kme*", "qtls*", "app*", "viz*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: long-running tests (e.g. the literal 30s Phase 2 run); deselected by default",
]
addopts = "-m 'not slow'"
